name: CI

# Parked: nothing here runs by itself.
#
# The lanes below still work and are still worth running -- shellcheck and the
# dash parse over every script, the whole suite through test/run, and the
# same three compiling lanes again under clang. What has gone is the push and
# pull_request triggers, so it costs nothing until somebody asks for it.
#
# Run it from the Actions tab, or with: gh workflow run ci.yml
# Restore automatic runs by putting the push and pull_request keys back.
#
# Security matrix (SECURITY_TEST_MATRIX.md):
#   - suite runs full `sh test/run`, which includes socket / net / machine and
#     tls_chains (lane_net invokes `python3 test/differential.py --harness
#     tls_chains`). Unrelated NOT RUN lanes (native, boot without an image,
#     …) also make that job exit non-zero, so a green security signal is the
#     dedicated `security` job below.
#   - security runs net + machine + an explicit tls_chains step.
on:
  workflow_dispatch:

env:
  SHELLCHECK_VERSION: "0.10.0"

jobs:
  scripts:
    name: Scripts (syntax, shellcheck, dash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dash
        run: sudo apt-get update && sudo apt-get install -y dash

      # Pinned: the distro's shellcheck version decides which SC3xxx POSIX
      # compatibility checks fire, so an unpinned one makes CI disagree with
      # whatever a contributor has installed locally.
      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: Parse POSIX scripts with dash
        run: |
          for f in src/build/host.sh \
                   test/onbox test/profile_shell \
                   kernel/patch/apply kernel/replace/apply \
                   test/run build.sh; do
            echo "dash -n $f"
            dash -n "$f"
          done

      # The build path is one C program now. It has to compile with nothing
      # but a compiler.
      - name: Bootstrap the build tool
        run: |
          cc -O2 -static -nostdlib -nostartfiles -fno-stack-protector \
             -fno-builtin -w -o build src/build/build.c
          ./build --help > /dev/null

      # Every script in the repo is shellcheck clean at -S warning; keep it that way.
      - name: shellcheck
        run: |
          shellcheck -S warning \
            src/build/host.sh test/onbox test/profile_shell \
            kernel/patch/apply kernel/replace/apply \
            test/run build.sh

  suite:
    name: Every test (sh test/run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dash is what the shell suite compares against, qemu and the two cross
      # compilers are what runs the assembly in library.c on the machines this
      # one is not. Each lane says so and skips itself when its tool is
      # missing, so a forgotten package here is quiet -- which is exactly why
      # they are installed rather than assumed. openssl is the tls_chains
      # oracle used inside lane_net (SECURITY_TEST_MATRIX certificate row).
      - name: Install what the lanes need
        run: |
          sudo apt-get update
          sudo apt-get install -y dash qemu-user \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu openssl

      - name: Run it
        run: sh test/run

  # Focused gate for SECURITY_TEST_MATRIX network / identity / certificate rows.
  # suite covers the same lanes via full `sh test/run`, but also fails on
  # unrelated NOT RUN (native on Linux x86_64, boot without an image, …).
  security:
    name: Security lanes (net, machine, tls_chains)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cross compilers + qemu-user let freestanding net/machine exercise
      # x86_64, arm64, and riscv64. A missing arch is NOT RUN (lane exit 2 →
      # `did not run:`), which already fails `test/run`. The step below also
      # greps the tally for all three arch rows so a silent skip cannot pass.
      - name: Install net/machine/tls_chains dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dash qemu-user \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu openssl

      - name: Freestanding net and machine
        run: |
          set -o pipefail
          sh test/run net machine | tee "$RUNNER_TEMP/net-machine.log"
          # Hard gate: each freestanding suite must have tally rows for all
          # three arches (names from target_lane / freestanding_checks_one).
          for suite in net machine; do
            for arch in x86_64 arm64 riscv64; do
              if ! grep -E "^  ${suite}-${arch}[[:space:]]+[0-9]+ of [0-9]+$" \
                  "$RUNNER_TEMP/net-machine.log"; then
                echo "required security lane missing or did not run: ${suite}-${arch}"
                exit 1
              fi
            done
          done

      # Also embedded in lane_net; kept explicit so a certificate failure is
      # a named step. Exit 1 is a real oracle disagreement and fails the job.
      # Exit 2 is NOT RUN (non-Linux or no openssl) and is reported without
      # failing — for odd hosts, not for this runner where openssl is installed.
      - name: TLS chain differential oracle
        run: |
          set +e
          python3 test/differential.py --harness tls_chains
          status=$?
          set -e
          case "$status" in
            0) echo "tls_chains: ok" ;;
            2) echo "tls_chains: NOT RUN (needs Linux and openssl)" ;;
            *) echo "tls_chains: failed (exit $status)"; exit 1 ;;
          esac

  clang:
    name: The library, the probes and the shell under clang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dash
        run: sudo apt-get update && sudo apt-get install -y dash clang

      # The three lanes that compile something of ours. gcc builds them in
      # the job above; this is the same code through the other compiler,
      # which is where a freestanding link tends to differ.
      - name: Run the lanes that compile
        run: CC=clang sh test/run standard probe shell
